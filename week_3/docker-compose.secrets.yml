services:
  backend:
    environment:
      OLLAMA_HOST_FILE: /run/secrets/ollama_host
      OLLAMA_MODEL_FILE: /run/secrets/ollama_model
    secrets:
      - ollama_host
      - ollama_model

secrets:
  ollama_host:
    file: ./secrets/ollama_host.txt
  ollama_model:
    file: ./secrets/ollama_model.txt
