services:
  frontend:
    build:
      context: ./frontend
    image: week3-frontend:1.0
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: /api/chat
      BACKEND_INTERNAL_URL: http://backend:8001/chat
      WEEK1_DB_PATH: /data/week1/jobs.db
    volumes:
      - ../week_1/data/3_gold:/data/week1:ro
    networks:
      - week3

  backend:
    build:
      context: ./backend
    image: week3-backend:1.0
    ports:
      - "8001:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: deepseek-r1:1.5b
    networks:
      - week3

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - week3

networks:
  week3:

volumes:
  ollama-data:
