<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #1f2937;
      }

      .chat-app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        flex: 0 0 auto;
        background: #ffffff;
        border-bottom: 1px solid #d9dee7;
      }

      .topbar-inner,
      .chat-history,
      .composer-inner {
        width: min(100%, 1280px);
        margin: 0 auto;
      }

      .topbar-inner {
        padding: 1rem clamp(1rem, 3vw, 2rem);
      }

      .nav-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .chat-main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        background: #f6f7f9;
      }

      .chat-history {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.25rem clamp(1rem, 3vw, 2rem);
      }

      .message {
        width: fit-content;
        max-width: min(82%, 920px);
        border-radius: 8px;
        padding: 0.8rem 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message-user {
        align-self: flex-end;
        background: #0d6efd;
        color: #ffffff;
      }

      .message-assistant {
        align-self: flex-start;
        background: #ffffff;
        border: 1px solid #d9dee7;
        color: #172554;
      }

      .message-error {
        align-self: flex-start;
        background: #fff5f5;
        border: 1px solid #f1aeb5;
        color: #842029;
      }

      .message-working {
        color: #495057;
      }

      .composer-wrap {
        flex: 0 0 auto;
        background: #ffffff;
        border-top: 1px solid #d9dee7;
      }

      .composer-inner {
        padding: 1rem clamp(1rem, 3vw, 2rem);
      }

      .composer-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 360px) auto;
        gap: 1rem;
        align-items: end;
      }

      textarea {
        min-height: 64px;
        max-height: 180px;
        resize: vertical;
      }

      .file-panel {
        display: grid;
        gap: 0.45rem;
      }

      .file-state {
        min-height: 1.5rem;
        font-size: 0.9rem;
        color: #6c757d;
        overflow-wrap: anywhere;
      }

      .composer-actions {
        display: flex;
        gap: 0.5rem;
      }

      .send-button {
        min-width: 96px;
      }

      @media (max-width: 991.98px) {
        .composer-grid {
          grid-template-columns: 1fr;
        }

        .composer-actions {
          justify-content: flex-end;
        }
      }

      @media (max-width: 767.98px) {
        .topbar-inner {
          align-items: flex-start;
        }

        .message {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-app">
      <header class="topbar">
        <div class="topbar-inner d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div>
            <h1 class="h4 mb-1">Resume Helper Chatbot</h1>
            <p class="mb-0 text-secondary">Containerized frontend chat interface</p>
          </div>
          <nav class="nav-actions" aria-label="Chat navigation">
            <a class="btn btn-outline-secondary btn-sm" href="/">Pipeline</a>
            <a class="btn btn-outline-secondary btn-sm" href="/dashboard">Database Dashboard</a>
            <span id="statusBadge" class="badge text-bg-secondary">Ready</span>
          </nav>
        </div>
      </header>

      <main class="chat-main">
        <div id="chatHistory" class="chat-history" aria-live="polite">
          <div class="message message-assistant">
            Send a message, paste a resume, or attach a PDF to summarize a resume or analyze skill gaps.
          </div>
        </div>
      </main>

      <form id="chatForm" class="composer-wrap">
        <div class="composer-inner">
          <div class="composer-grid">
            <div>
              <label for="messageInput" class="form-label">Message</label>
              <textarea id="messageInput" class="form-control" placeholder="Ask for resume advice..." rows="2"></textarea>
              <div class="form-text">Enter sends. Shift+Enter adds a new line.</div>
            </div>

            <div class="file-panel">
              <label for="pdfInput" class="form-label mb-0">PDF</label>
              <input id="pdfInput" class="form-control" type="file" accept="application/pdf,.pdf">
              <div id="fileState" class="file-state">No PDF selected.</div>
            </div>

            <div class="composer-actions">
              <button id="clearFileButton" class="btn btn-outline-secondary" type="button" disabled>Clear file</button>
              <button id="sendButton" class="btn btn-primary send-button" type="submit">Send</button>
            </div>
          </div>
        </div>
      </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      const backendUrl = {{ backend_url | tojson }};
      const chatForm = document.querySelector("#chatForm");
      const chatHistory = document.querySelector("#chatHistory");
      const messageInput = document.querySelector("#messageInput");
      const pdfInput = document.querySelector("#pdfInput");
      const fileState = document.querySelector("#fileState");
      const clearFileButton = document.querySelector("#clearFileButton");
      const sendButton = document.querySelector("#sendButton");
      const statusBadge = document.querySelector("#statusBadge");
      let isSending = false;

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }

      function setStatus(text, variant) {
        statusBadge.textContent = text;
        statusBadge.className = `badge text-bg-${variant}`;
      }

      function appendMessage(text, type, extraClass = "") {
        const message = document.createElement("div");
        message.className = `message message-${type}${extraClass ? ` ${extraClass}` : ""}`;
        message.textContent = text;
        chatHistory.appendChild(message);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return message;
      }

      function updateMessage(element, text, type, extraClass = "") {
        element.className = `message message-${type}${extraClass ? ` ${extraClass}` : ""}`;
        element.textContent = text;
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function formatFileSize(bytes) {
        if (!Number.isFinite(bytes) || bytes <= 0) {
          return "0 KB";
        }

        const kilobytes = bytes / 1024;
        if (kilobytes < 1024) {
          return `${kilobytes.toFixed(1)} KB`;
        }

        return `${(kilobytes / 1024).toFixed(1)} MB`;
      }

      function updateFileState() {
        const file = pdfInput.files[0] || null;
        if (!file) {
          fileState.textContent = "No PDF selected.";
          clearFileButton.disabled = true;
          return;
        }

        fileState.textContent = `${file.name} (${formatFileSize(file.size)})`;
        clearFileButton.disabled = false;
      }

      function shouldInsertSpace(previousItem, currentItem) {
        if (!previousItem || previousItem.hasEOL) {
          return false;
        }

        const previousX = previousItem.transform[4] || 0;
        const currentX = currentItem.transform[4] || 0;
        const previousWidth = previousItem.width || 0;
        const fontSize = Math.abs(currentItem.transform[0] || currentItem.height || 10);
        const gap = currentX - (previousX + previousWidth);

        return gap > fontSize * 0.28;
      }

      function normalizeExtractedText(text) {
        return text
          .replace(/\b[A-Za-z0-9](?: [A-Za-z0-9])+\b/g, (value) => value.replaceAll(" ", ""))
          .replace(/[ \t]{2,}/g, " ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function buildPageText(items) {
        let text = "";
        let previousItem = null;

        items.forEach((item) => {
          const value = item.str || "";
          if (!value) {
            return;
          }

          if (previousItem?.hasEOL) {
            text += "\n";
          } else if (shouldInsertSpace(previousItem, item) && !text.endsWith(" ") && !text.endsWith("\n")) {
            text += " ";
          }

          text += value;
          previousItem = item;
        });

        return normalizeExtractedText(text);
      }

      async function extractPdfText(file) {
        if (!file) {
          return "";
        }

        if (!window.pdfjsLib) {
          throw new Error("PDF tools are unavailable.");
        }

        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        if (!isPdf) {
          throw new Error("Only PDF files are supported.");
        }

        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const pages = [];

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();
          const pageText = buildPageText(content.items);
          if (pageText) {
            pages.push(pageText);
          }
        }

        return normalizeExtractedText(pages.join("\n\n"));
      }

      function getResponseText(data) {
        if (typeof data === "string") {
          return data;
        }

        return data.response || data.reply || data.answer || data.message || JSON.stringify(data, null, 2);
      }

      function submitChatForm() {
        if (!isSending) {
          chatForm.requestSubmit();
        }
      }

      clearFileButton.addEventListener("click", () => {
        pdfInput.value = "";
        updateFileState();
        pdfInput.focus();
      });

      pdfInput.addEventListener("change", updateFileState);

      messageInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey || event.isComposing) {
          return;
        }

        event.preventDefault();
        submitChatForm();
      });

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (isSending) {
          return;
        }

        const message = messageInput.value.trim();
        const pdfFile = pdfInput.files[0] || null;

        if (!message && !pdfFile) {
          appendMessage("Enter a message or attach a PDF before sending.", "error");
          return;
        }

        appendMessage(message || `Attached PDF: ${pdfFile.name}`, "user");
        messageInput.value = "";
        isSending = true;
        sendButton.disabled = true;
        setStatus(pdfFile ? "Reading PDF" : "Sending", "primary");
        const pendingMessage = appendMessage(
          pdfFile ? "Reading the PDF and preparing your request..." : "Waiting for the backend response...",
          "assistant",
          "message-working",
        );

        try {
          const pdfText = await extractPdfText(pdfFile);
          updateMessage(pendingMessage, "Waiting for the backend response...", "assistant", "message-working");
          setStatus("Waiting", "primary");

          const response = await fetch(backendUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message,
              pdf_text: pdfText,
            }),
          });

          if (!response.ok) {
            throw new Error(`Backend returned HTTP ${response.status}`);
          }

          const contentType = response.headers.get("content-type") || "";
          const data = contentType.includes("application/json") ? await response.json() : await response.text();
          updateMessage(pendingMessage, getResponseText(data), "assistant");
          setStatus("Ready", "secondary");
        } catch (error) {
          console.error(error);
          updateMessage(
            pendingMessage,
            "The backend is not available or the request could not be completed. Check that the backend service is running and try again.",
            "error",
          );
          setStatus("Error", "danger");
        } finally {
          isSending = false;
          sendButton.disabled = false;
          messageInput.focus();
        }
      });

      updateFileState();
    </script>
  </body>
</html>
