<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      body {
        min-height: 100vh;
        background: #f6f7f9;
      }

      .dashboard-shell {
        min-height: 100vh;
      }

      .surface {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 10px 28px rgba(23, 37, 84, 0.08);
      }

      .metric {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
      }

      .chart-box {
        min-height: 320px;
      }

      .chart-frame {
        position: relative;
        height: 280px;
        width: 100%;
      }

      .chart-frame canvas {
        display: block;
        max-height: 280px;
      }

      .result-list {
        max-height: 520px;
        overflow-y: auto;
      }

      .job-result {
        border: 1px solid #d9dee7;
        border-radius: 8px;
      }

      .job-result p {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main class="dashboard-shell py-4">
      <div class="container">
        <header class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
          <div>
            <h1 class="h3 mb-1">Week 1 Job Database</h1>
            <p class="mb-0 text-secondary">Charts and search tools</p>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" href="/">Pipeline</a>
            <a class="btn btn-outline-primary" href="/chat">Back to Chat</a>
          </div>
        </header>

        <section class="row g-3 mb-4" aria-label="Database summary">
          <div class="col-12 col-md-4">
            <div class="metric p-3">
              <div class="text-secondary small">Jobs</div>
              <div id="totalJobs" class="display-6">-</div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="metric p-3">
              <div class="text-secondary small">Companies</div>
              <div id="totalCompanies" class="display-6">-</div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="metric p-3">
              <div class="text-secondary small">Top company</div>
              <div id="topCompany" class="h5 mb-0">-</div>
            </div>
          </div>
        </section>

        <section class="row g-4 mb-4">
          <div class="col-12 col-xl-5">
            <div class="surface chart-box p-3">
              <h2 class="h5">Top Companies</h2>
              <div class="chart-frame">
                <canvas id="topCompaniesChart"></canvas>
              </div>
            </div>
          </div>
          <div class="col-12 col-xl-7">
            <div class="surface chart-box p-3">
              <h2 class="h5">Job Distribution</h2>
              <div class="chart-frame">
                <canvas id="jobDistributionChart"></canvas>
              </div>
            </div>
          </div>
        </section>

        <section class="surface p-3">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <h2 class="h5 mb-0">Search Jobs</h2>
            <span id="searchStatus" class="badge text-bg-secondary">Ready</span>
          </div>
          <form id="searchForm" class="row g-2 mb-3">
            <div class="col-12 col-lg-10">
              <label for="searchInput" class="visually-hidden">Search jobs</label>
              <input id="searchInput" class="form-control" type="search" value="python" placeholder="Search title, company, description, or tech stack">
            </div>
            <div class="col-12 col-lg-2 d-grid">
              <button class="btn btn-primary" type="submit">Search</button>
            </div>
          </form>
          <div id="results" class="result-list d-flex flex-column gap-2"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <script>
      const totalJobs = document.querySelector("#totalJobs");
      const totalCompanies = document.querySelector("#totalCompanies");
      const topCompany = document.querySelector("#topCompany");
      const searchForm = document.querySelector("#searchForm");
      const searchInput = document.querySelector("#searchInput");
      const searchStatus = document.querySelector("#searchStatus");
      const results = document.querySelector("#results");

      const chartColors = [
        "#0d6efd",
        "#198754",
        "#dc3545",
        "#ffc107",
        "#6f42c1",
        "#20c997",
        "#fd7e14",
        "#0dcaf0",
        "#6c757d",
      ];

      function setSearchStatus(text, variant) {
        searchStatus.textContent = text;
        searchStatus.className = `badge text-bg-${variant}`;
      }

      function renderChart(canvasId, type, labels, counts, label) {
        const canvas = document.querySelector(canvasId);
        if (!canvas || !window.Chart) {
          return;
        }

        new Chart(canvas, {
          type,
          data: {
            labels,
            datasets: [
              {
                label,
                data: counts,
                backgroundColor: chartColors,
                borderColor: "#ffffff",
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: type === "pie" ? "bottom" : "top",
              },
            },
            scales: type === "bar" ? {
              y: {
                beginAtZero: true,
                ticks: {
                  precision: 0,
                },
              },
            } : {},
          },
        });
      }

      async function loadSummary() {
        const response = await fetch("/api/jobs/summary");
        if (!response.ok) {
          throw new Error(`Summary request failed with HTTP ${response.status}`);
        }

        const summary = await response.json();
        totalJobs.textContent = summary.total_jobs;
        totalCompanies.textContent = summary.total_companies;
        topCompany.textContent = summary.top_company
          ? `${summary.top_company.name} (${summary.top_company.count})`
          : "-";

        renderChart(
          "#topCompaniesChart",
          "pie",
          summary.charts.top_companies.labels,
          summary.charts.top_companies.counts,
          "Jobs",
        );
        renderChart(
          "#jobDistributionChart",
          "bar",
          summary.charts.job_distribution.labels,
          summary.charts.job_distribution.counts,
          "Jobs",
        );
      }

      function renderJobs(jobs) {
        results.innerHTML = "";

        if (!jobs.length) {
          results.innerHTML = '<div class="alert alert-secondary mb-0">No jobs matched that search.</div>';
          return;
        }

        for (const job of jobs) {
          const item = document.createElement("article");
          item.className = "job-result p-3";
          item.innerHTML = `
            <div class="d-flex flex-wrap justify-content-between gap-2">
              <div>
                <h3 class="h6 mb-1"></h3>
                <div class="text-secondary small"></div>
              </div>
              <span class="badge text-bg-light"></span>
            </div>
            <p class="mt-2 mb-2"></p>
            <div class="small text-secondary"></div>
          `;

          item.querySelector("h3").textContent = job.job_title;
          item.querySelector(".text-secondary.small").textContent = job.company;
          item.querySelector(".badge").textContent = job.quality || "unlabeled";
          item.querySelector("p").textContent = job.description_excerpt || "No description available.";
          item.querySelector("div.small.text-secondary").textContent = job.tech_stack
            ? `Tech stack: ${job.tech_stack}`
            : "Tech stack: not tagged";
          results.appendChild(item);
        }
      }

      async function searchJobs(query) {
        setSearchStatus("Searching", "primary");
        const response = await fetch(`/api/jobs/search?q=${encodeURIComponent(query)}&limit=25`);
        if (!response.ok) {
          throw new Error(`Search request failed with HTTP ${response.status}`);
        }

        const data = await response.json();
        renderJobs(data.jobs);
        setSearchStatus(`${data.count} result${data.count === 1 ? "" : "s"}`, "secondary");
      }

      searchForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          await searchJobs(searchInput.value.trim());
        } catch (error) {
          console.error(error);
          setSearchStatus("Error", "danger");
          results.innerHTML = '<div class="alert alert-danger mb-0">Unable to search the Week 1 database.</div>';
        }
      });

      loadSummary()
        .then(() => searchJobs(searchInput.value.trim()))
        .catch((error) => {
          console.error(error);
          setSearchStatus("Error", "danger");
          results.innerHTML = '<div class="alert alert-danger mb-0">Unable to load the Week 1 database dashboard.</div>';
        });
    </script>
  </body>
</html>
